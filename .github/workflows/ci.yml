name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: goravel_dbos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goravel_dbos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      GORAVEL_DBOS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/goravel_dbos_test?sslmode=disable
      GORAVEL_DBOS_V1_FIXTURE: /tmp/dbos-v1-fixture

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make format-check

      - name: Tidy modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build DBOS 1.0 upgrade fixture
        working-directory: testdata/upgrade
        run: go build -mod=readonly -o "$GORAVEL_DBOS_V1_FIXTURE" .

      - name: Vet
        run: make vet

      - name: Test with PostgreSQL
        run: make test

      - name: Verify PostgreSQL release gate
        run: make test-postgres

      - name: Race test with PostgreSQL
        run: make race
